<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8b2635">
    <title>Offline — Mailroom Ops</title>
    <style>
        html, body { height: 100%; }
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f3ec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1b2a4a;
            text-align: center;
        }
        .wrap { max-width: 320px; padding: 24px; }
        .wrap img { width: 72px; height: 72px; border-radius: 14px; }
        h1 { font-size: 18px; margin: 16px 0 6px; }
        p { font-size: 13px; color: #4b5570; margin: 0 0 18px; line-height: 1.5; }
        button {
            border: none;
            background: #8b2635;
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #6f1d29; }
    </style>
</head>
<body>
    <div class="wrap">
        <img src="images/logo.png" alt="Mailroom Ops">
        <h1>You're offline</h1>
        <p>Connect to the network to load live mailroom data. Your cached pages will resume automatically.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
